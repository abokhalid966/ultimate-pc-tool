name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Pushes to main publish (or update) the GitHub release for the version in tauri.conf.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'v__VERSION__' || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
          releaseName: "Ultimate PC Tool v__VERSION__"
          releaseBody: "Download the file ending in _x64-setup.exe below and run it. Windows may say it protected your PC: click More info, then Run anyway."
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-pc-tool-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
